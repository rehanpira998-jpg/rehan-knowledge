<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#087df5;
    color:white;
}

/* HEADER */
header{
    min-height:420px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px 20px;
    background:linear-gradient(180deg,#006fff,#20a9ff);
}

.logo{
    width:120px;
    height:120px;
    border-radius:30px;
    background:white;
    color:#087df5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:900;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    margin-bottom:22px;
}

header h1{
    font-size:44px;
    margin-bottom:12px;
}

header p{
    font-size:20px;
    opacity:.95;
}

.beginner{
    margin-top:20px;
    padding:12px 22px;
    background:white;
    color:#087df5;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* NAVIGATION */
nav{
    position:sticky;
    top:0;
    z-index:10;
    background:#005dcc;
    padding:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    margin:0 12px;
}

nav a:hover{
    text-decoration:underline;
}

/* MAIN */
main{
    max-width:1000px;
    margin:auto;
    padding:35px 18px;
}

.section-title{
    text-align:center;
    font-size:32px;
    margin-bottom:25px;
}

/* CARDS */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.card{
    background:white;
    color:#222;
    border-radius:20px;
    padding:25px;
    min-height:180px;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.card .icon{
    font-size:42px;
    margin-bottom:12px;
}

.card h3{
    color:#087df5;
    margin-bottom:10px;
    font-size:22px;
}

.card p{
    line-height:1.6;
}

/* ROBLOX HISTORY */
.history{
    margin-top:45px;
}

.history-box{
    background:rgba(0,0,0,.15);
    border-radius:20px;
    padding:25px;
    line-height:1.7;
}

.history-box h3{
    margin-bottom:10px;
}

/* PROFILE */
.profile{
    margin-top:45px;
}

.profile-box{
    background:white;
    color:#222;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.profile-box h3{
    color:#087df5;
    margin-bottom:15px;
}

.profile-item{
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.profile-item:last-child{
    border-bottom:none;
}

.games{
    margin-top:45px;
}

.game-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}
