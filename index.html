<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rehan's Roblox World</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#05050a;
  color:white;
  line-height:1.5;
}

nav{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 6%;
  background:rgba(5,5,10,.95);
  border-bottom:1px solid #713cff;
  backdrop-filter:blur(12px);
}

.logo{
  font-size:21px;
  font-weight:900;
  color:#a86cff;
}

nav a{
  color:#ddd;
  text-decoration:none;
  margin-left:20px;
  font-size:14px;
  font-weight:bold;
}

nav a:hover{
  color:#b77cff;
}

.hero{
  min-height:85vh;
  padding:80px 6%;
  display:flex;
  align-items:center;
  background:
  radial-gradient(circle at 80% 25%,rgba(126,55,255,.35),transparent 30%),
  radial-gradient(circle at 20% 80%,rgba(50,80,255,.15),transparent 30%),
  linear-gradient(135deg,#090912,#16072e 55%,#05050a);
}

.hero-text{
  max-width:700px;
}

.badge{
  color:#a66cff;
  font-weight:900;
  letter-spacing:3px;
}

h1{
  font-size:clamp(45px,9vw,85px);
  line-height:.95;
  margin:16px 0;
}

h1 span{
  color:#9b55ff;
}

.hero p{
  color:#aaa;
  max-width:560px;
  margin:22px 0;
  font-size:17px;
}

.btn{
  display:inline-block;
  padding:13px 22px;
  border-radius:10px;
  text-decoration:none;
  color:white;
  font-weight:800;
  margin-right:8px;
  margin-top:5px;
  background:linear-gradient(90deg,#6b25ff,#4d8dff);
  box-shadow:0 0 25px rgba(125,70,255,.25);
}

.btn.alt{
  background:transparent;
  border:1px solid #8d43ff;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:35px;
}

.card{
  background:linear-gradient(145deg,#11111c,#0b0b12);
  border:1px solid #29233b;
  border-radius:16px;
  padding:20px;
}

.stat b{
  display:block;
  font-size:27px;
}

.stat small{
  color:#999;
}

section{
  padding:70px 6%;
}

.title{
  font-size:34px;
